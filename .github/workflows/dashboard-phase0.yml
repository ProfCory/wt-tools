name: Dashboard Phase 0

on:
  pull_request:
    paths:
      - "docs/dashboard/**"
      - ".github/workflows/dashboard-phase0.yml"
  push:
    branches:
      - main
    paths:
      - "docs/dashboard/**"
      - ".github/workflows/dashboard-phase0.yml"

permissions:
  contents: read

jobs:
  contracts-and-resolver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docs

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install validation dependencies
        run: npm ci --ignore-scripts

      - name: Check resolver syntax
        run: node --check dashboard/js/data-resolver.js

      - name: Run Phase 0 tests
        run: node --test dashboard/test/*.test.mjs
